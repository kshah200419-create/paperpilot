# One-command demo:  docker compose up --build   ->  http://localhost:8080
name: paperpilot

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paperpilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paperpilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      args:
        PRELOAD_MODEL: ${PRELOAD_MODEL:-true}
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/paperpilot
      EMBEDDER: ${EMBEDDER:-auto}
      RERANKER: ${RERANKER:-none}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      LOG_JSON: "true"
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
