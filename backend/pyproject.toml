[project]
name = "paperpilot"
version = "0.1.0"
description = "AI research assistant over arXiv: ingestion, hybrid search, grounded Q&A with citations, and research-trend analytics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "PaperPilot Dev" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "pgvector>=0.3",
  "alembic>=1.13",
  "httpx>=0.27",
  "defusedxml>=0.7",
  "structlog>=24.1",
  "numpy>=1.26",
  "scikit-learn>=1.5",
  "typer>=0.12",
]

[project.optional-dependencies]
ml = ["fastembed>=0.4"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit>=3.7",
]

[project.scripts]
paperpilot = "paperpilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperpilot"]

[tool.hatch.build.targets.sdist]
include = ["src/paperpilot", "alembic", "alembic.ini"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "db: tests that need a running Postgres with pgvector (skipped if unavailable)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "C4", "PT"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "PT018", "E501"]
"alembic/**" = ["N999"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["paperpilot"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fastembed.*", "sklearn.*", "pgvector.*", "defusedxml.*", "scipy.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["paperpilot"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = false
